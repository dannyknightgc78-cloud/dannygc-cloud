<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLOUD | Sovereign Search</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #020a12;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #cloud-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .main-wrap {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 40px 0;
        }
        .search-container {
            background: rgba(0, 10, 22, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 229, 255, 0.18);
            border-radius: 24px;
            padding: 44px 50px 40px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5), inset 0 0 30px rgba(0,229,255,0.03), 0 0 80px rgba(0,229,255,0.05);
            width: 100%;
        }
        h1 {
            font-size: 4.5rem;
            font-weight: 900;
            letter-spacing: 10px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #ffffff 0%, #00e5ff 60%, #0080ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 24px rgba(0,229,255,0.5));
        }
        .tagline {
            font-size: 0.92rem;
            color: rgba(0,229,255,0.5);
            margin-bottom: 36px;
            font-style: italic;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
        }
        .search-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-bar {
            flex: 1;
            padding: 15px 22px;
            font-size: 1rem;
            color: #fff;
            background: rgba(0,0,0,0.45);
            border: 1px solid rgba(0,229,255,0.25);
            border-radius: 50px;
            outline: none;
            transition: all 0.3s;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .search-bar:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 24px rgba(0,229,255,0.35), inset 0 2px 10px rgba(0,0,0,0.5);
            background: rgba(0,10,20,0.65);
        }
        .search-bar::placeholder { color: rgba(0,229,255,0.3); }
        .button-group { display: flex; gap: 14px; justify-content: center; }
        .glass-btn {
            background: rgba(0,229,255,0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,229,255,0.3);
            color: #00e5ff;
            padding: 11px 28px;
            font-size: 0.88rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .glass-btn:hover {
            background: rgba(0,229,255,0.18);
            box-shadow: 0 0 20px rgba(0,229,255,0.4);
            transform: translateY(-2px);
        }
        .glass-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-cloudit {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.8);
        }
        .btn-cloudit:hover {
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 15px rgba(255,255,255,0.15);
        }

        /* Results panel */
        #results-panel {
            display: none;
            background: rgba(0,10,22,0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0,229,255,0.15);
            border-radius: 20px;
            padding: 24px 28px;
            width: 100%;
            box-shadow: 0 8px 40px rgba(0,0,0,0.4), 0 0 40px rgba(0,229,255,0.04);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0,229,255,0.1);
        }
        .results-label {
            font-family: 'Courier New', monospace;
            font-size: 0.65rem;
            color: rgba(0,229,255,0.5);
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .results-query {
            font-family: 'Courier New', monospace;
            font-size: 0.65rem;
            color: rgba(0,229,255,0.35);
            max-width: 60%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #results-content {
            font-size: 0.88rem;
            line-height: 1.7;
            color: #c8e8ff;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Loading state */
        .loading-state {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(0,229,255,0.7);
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
        }
        .loading-dots {
            display: flex;
            gap: 5px;
        }
        .loading-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: rgba(0,229,255,0.7);
            box-shadow: 0 0 6px rgba(0,229,255,0.6);
            animation: dotPulse 1.2s ease-in-out infinite;
        }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPulse {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.2); }
        }
        .close-btn {
            background: none;
            border: none;
            color: rgba(0,229,255,0.4);
            cursor: pointer;
            font-size: 1rem;
            padding: 2px 6px;
            border-radius: 4px;
            transition: color 0.2s;
        }
        .close-btn:hover { color: rgba(0,229,255,0.9); }
    </style>
</head>
<body>
    <canvas id="cloud-canvas"></canvas>

    <div class="main-wrap">
        <div class="search-container">
            <h1>CLOUD</h1>
            <p class="tagline">Why Google me when you can Cloud me?</p>
            <div class="search-row">
                <input type="text" id="search-input" class="search-bar" placeholder="Initiate sovereign query..." autocomplete="off">
            </div>
            <div class="button-group">
                <button class="glass-btn" id="btn-cloud-me" onclick="doSearch()">Cloud Me</button>
                <button class="glass-btn btn-cloudit" id="btn-cloudit" onclick="doGoogleSearch()">CloudIt ↗</button>
            </div>
        </div>

        <!-- Results Panel -->
        <div id="results-panel">
            <div class="results-header">
                <span class="results-label">&#9670; Agent Zero Response</span>
                <span class="results-query" id="results-query-label"></span>
                <button class="close-btn" onclick="closeResults()" title="Close">&#10005;</button>
            </div>
            <div id="results-content"></div>
        </div>
    </div>

    <script>
        // ═══ SEARCH ENGINE BRAIN ═══
        const AZ_ENDPOINT = 'http://38.247.186.142:8090/api_message';
        const AZ_API_KEY  = 'O7m1g0xar';

        const searchInput = document.getElementById('search-input');
        const resultsPanel = document.getElementById('results-panel');
        const resultsContent = document.getElementById('results-content');
        const resultsQueryLabel = document.getElementById('results-query-label');
        const btnCloudMe = document.getElementById('btn-cloud-me');

        searchInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') doSearch();
        });

        function closeResults() {
            resultsPanel.style.display = 'none';
        }

        function doGoogleSearch() {
            const q = searchInput.value.trim();
            if (!q) return;
            window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank', 'noopener,noreferrer');
        }

        async function doSearch() {
            const q = searchInput.value.trim();
            if (!q) return;

            // Show loading state
            resultsPanel.style.display = 'block';
            resultsQueryLabel.textContent = '"' + q + '"';
            resultsContent.innerHTML = `
                <div class="loading-state">
                    <div class="loading-dots">
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                    </div>
                    <span>Clouding...</span>
                </div>`;
            btnCloudMe.disabled = true;

            try {
                const res = await fetch(AZ_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-KEY': AZ_API_KEY
                    },
                    body: JSON.stringify({ message: q, stream: false })
                });

                if (!res.ok) throw new Error('Agent Zero returned HTTP ' + res.status);
                const data = await res.json();

                // Extract reply from common Agent Zero response fields
                const reply = data.response || data.message || data.content ||
                              data.text || data.output || data.answer ||
                              (data.messages && data.messages[data.messages.length - 1]?.content) ||
                              JSON.stringify(data, null, 2);

                resultsContent.textContent = reply;

            } catch (err) {
                resultsContent.innerHTML = `<span style="color:#ef4444">&#9888; Error: ${err.message}</span>
<span style="color:rgba(0,229,255,0.4);font-size:0.78rem">Make sure Agent Zero is running and CORS allows this origin.</span>`;
            } finally {
                btnCloudMe.disabled = false;
                resultsPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // ═══ CLOUD-SHAPED PARTICLE SYSTEM ═══
        const canvas = document.getElementById('cloud-canvas');
        const ctx = canvas.getContext('2d');
        let W = canvas.width = window.innerWidth;
        let H = canvas.height = window.innerHeight;

        // Generate points constrained to a cloud silhouette
        function cloudShape(cx, cy, scale) {
            const bumps = [
                { x: 0,    y: 0,    r: 115 },
                { x: -105, y: 22,   r: 82  },
                { x: 105,  y: 22,   r: 82  },
                { x: -58,  y: -58,  r: 72  },
                { x: 58,   y: -58,  r: 72  },
                { x: -168, y: 52,   r: 56  },
                { x: 168,  y: 52,   r: 56  },
            ];
            const points = [];
            const n = Math.min(Math.floor(550 * scale), 700);
            let attempts = 0;
            while (points.length < n && attempts < n * 25) {
                attempts++;
                const bump = bumps[Math.floor(Math.random() * bumps.length)];
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * bump.r * scale;
                const px = cx + bump.x * scale + Math.cos(angle) * dist;
                const py = cy + bump.y * scale + Math.sin(angle) * dist;
                const inside = bumps.some(b => {
                    const dx = px - (cx + b.x * scale);
                    const dy = py - (cy + b.y * scale);
                    return dx*dx + dy*dy < (b.r * scale) * (b.r * scale);
                });
                if (inside) points.push({ x: px, y: py });
            }
            return points;
        }

        class Particle {
            constructor(tx, ty) {
                this.tx = tx; this.ty = ty;
                this.x = Math.random() * W;
                this.y = Math.random() * H;
                this.vx = 0; this.vy = 0;
                this.size = Math.random() * 1.6 + 0.5;
                this.pulse = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 0.035 + 0.018;
            }
            update() {
                this.pulse += 0.022;
                const wobble = Math.sin(this.pulse) * 1.4;
                this.vx += (this.tx - this.x + wobble) * this.speed;
                this.vy += (this.ty - this.y + wobble) * this.speed;
                this.vx *= 0.87; this.vy *= 0.87;
                this.x += this.vx; this.y += this.vy;
            }
            draw() {
                const alpha = 0.28 + 0.55 * (0.5 + 0.5 * Math.sin(this.pulse));
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0,229,255,${alpha})`;
                ctx.fill();
            }
        }

        let particles = [];
        let glowPhase = 0;

        function buildCloud() {
            const scale = Math.min(W, H) / 720;
            const cx = W / 2;
            const cy = H * 0.38;
            const pts = cloudShape(cx, cy, scale);
            if (particles.length === 0) {
                particles = pts.map(p => new Particle(p.x, p.y));
            } else {
                particles.forEach((p, i) => {
                    const t = pts[i % pts.length];
                    p.tx = t.x; p.ty = t.y;
                });
            }
        }

        function connect() {
            const maxDist = 36;
            for (let a = 0; a < particles.length; a++) {
                for (let b = a + 1; b < particles.length; b++) {
                    const dx = particles[a].x - particles[b].x;
                    const dy = particles[a].y - particles[b].y;
                    const d2 = dx*dx + dy*dy;
                    if (d2 < maxDist * maxDist) {
                        const op = (1 - Math.sqrt(d2) / maxDist) * 0.3;
                        ctx.strokeStyle = `rgba(0,229,255,${op})`;
                        ctx.lineWidth = 0.6;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function drawGlow() {
            glowPhase += 0.01;
            const scale = Math.min(W, H) / 720;
            const cx = W / 2, cy = H * 0.38;
            const r = 240 * scale + Math.sin(glowPhase) * 20 * scale;
            const grad = ctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r);
            grad.addColorStop(0, `rgba(0,229,255,${0.05 + 0.025 * Math.sin(glowPhase)})`);
            grad.addColorStop(0.5, `rgba(0,100,255,${0.02 + 0.01 * Math.sin(glowPhase + 1)})`);
            grad.addColorStop(1, 'rgba(0,229,255,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, W, H);
            drawGlow();
            connect();
            particles.forEach(p => { p.update(); p.draw(); });
        }

        window.addEventListener('resize', () => {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            buildCloud();
        });

        buildCloud();
        animate();
    </script>
</body>
</html>
