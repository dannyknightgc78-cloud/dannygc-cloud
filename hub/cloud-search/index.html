<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLOUD | Sovereign Search</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #020a12;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #cloud-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .main-wrap {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 40px 0;
        }
        .search-container {
            background: rgba(0, 10, 22, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 229, 255, 0.18);
            border-radius: 24px;
            padding: 44px 50px 40px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5), inset 0 0 30px rgba(0,229,255,0.03), 0 0 80px rgba(0,229,255,0.05);
            width: 100%;
        }
        h1 {
            font-size: 4.5rem;
            font-weight: 900;
            letter-spacing: 10px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #ffffff 0%, #00e5ff 60%, #0080ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 24px rgba(0,229,255,0.5));
        }
        .tagline {
            font-size: 0.92rem;
            color: rgba(0,229,255,0.5);
            margin-bottom: 36px;
            font-style: italic;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
        }
        .search-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-bar {
            flex: 1;
            padding: 15px 22px;
            font-size: 1rem;
            color: #fff;
            background: rgba(0,0,0,0.45);
            border: 1px solid rgba(0,229,255,0.25);
            border-radius: 50px;
            outline: none;
            transition: all 0.3s;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .search-bar:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 24px rgba(0,229,255,0.35), inset 0 2px 10px rgba(0,0,0,0.5);
            background: rgba(0,10,20,0.65);
        }
        .search-bar::placeholder { color: rgba(0,229,255,0.3); }
        .button-group { display: flex; gap: 14px; justify-content: center; }
        .glass-btn {
            background: rgba(0,229,255,0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,229,255,0.3);
            color: #00e5ff;
            padding: 11px 28px;
            font-size: 0.88rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .glass-btn:hover {
            background: rgba(0,229,255,0.18);
            box-shadow: 0 0 20px rgba(0,229,255,0.4);
            transform: translateY(-2px);
        }
        .glass-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-cloudit {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.8);
        }
        .btn-cloudit:hover {
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 15px rgba(255,255,255,0.15);
        }

        /* Results panel */
        #results-panel {
            display: none;
            background: rgba(0,10,22,0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0,229,255,0.15);
            border-radius: 20px;
            padding: 24px 28px;
            width: 100%;
            box-shadow: 0 8px 40px rgba(0,0,0,0.4), 0 0 40px rgba(0,229,255,0.04);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0,229,255,0.1);
        }
        .results-label {
            font-family: 'Courier New', monospace;
            font-size: 0.65rem;
            color: rgba(0,229,255,0.5);
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .results-query {
            font-family: 'Courier New', monospace;
            font-size: 0.65rem;
            color: rgba(0,229,255,0.35);
            max-width: 60%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #results-content {
            font-size: 0.88rem;
            line-height: 1.7;
            color: #c8e8ff;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Loading state */
        .loading-state {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(0,229,255,0.7);
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
        }
        .loading-dots {
            display: flex;
            gap: 5px;
        }
        .loading-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: rgba(0,229,255,0.7);
            box-shadow: 0 0 6px rgba(0,229,255,0.6);
            animation: dotPulse 1.2s ease-in-out infinite;
        }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPulse {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.2); }
        }
        .close-btn {
            background: none;
            border: none;
            color: rgba(0,229,255,0.4);
            cursor: pointer;
            font-size: 1rem;
            padding: 2px 6px;
            border-radius: 4px;
            transition: color 0.2s;
        }
        .close-btn:hover { color: rgba(0,229,255,0.9); }
    </style>
</head>
<body>
    <canvas id="cloud-canvas"></canvas>

    <div class="main-wrap">
        <div class="search-container">
            <h1>CLOUD</h1>
            <p class="tagline">Why Google me when you can Cloud me?</p>
            <div class="search-row">
                <input type="text" id="search-input" class="search-bar" placeholder="Initiate sovereign query..." autocomplete="off">
            </div>
            <div class="button-group">
                <button class="glass-btn" id="btn-cloud-me" onclick="doSearch()">Cloud Me</button>
                <button class="glass-btn btn-cloudit" id="btn-cloudit" onclick="doGoogleSearch()">CloudIt ↗</button>
            </div>
        </div>

        <!-- Results Panel -->
        <div id="results-panel">
            <div class="results-header">
                <span class="results-label">&#9670; Agent Zero Response</span>
                <span class="results-query" id="results-query-label"></span>
                <button class="close-btn" onclick="closeResults()" title="Close">&#10005;</button>
            </div>
            <div id="results-content"></div>
        </div>
    </div>

    <script>
        // ═══ SEARCH ENGINE BRAIN ═══
        const AZ_ENDPOINT = 'http://38.247.186.142:8090/api_message';
        const AZ_API_KEY  = 'O7m1g0xar';

        const searchInput = document.getElementById('search-input');
        const resultsPanel = document.getElementById('results-panel');
        const resultsContent = document.getElementById('results-content');
        const resultsQueryLabel = document.getElementById('results-query-label');
        const btnCloudMe = document.getElementById('btn-cloud-me');

        searchInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') doSearch();
        });

        function closeResults() {
            resultsPanel.style.display = 'none';
        }

        function doGoogleSearch() {
            const q = searchInput.value.trim();
            if (!q) return;
            window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank', 'noopener,noreferrer');
        }

        async function doSearch() {
            const q = searchInput.value.trim();
            if (!q) return;

            // Show loading state
            resultsPanel.style.display = 'block';
            resultsQueryLabel.textContent = '"' + q + '"';
            resultsContent.innerHTML = `
                <div class="loading-state">
                    <div class="loading-dots">
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                    </div>
                    <span>Clouding...</span>
                </div>`;
            btnCloudMe.disabled = true;

            try {
                const res = await fetch(AZ_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-KEY': AZ_API_KEY
                    },
                    body: JSON.stringify({ message: q, stream: false })
                });

                if (!res.ok) throw new Error('Agent Zero returned HTTP ' + res.status);
                const data = await res.json();

                // Extract reply from common Agent Zero response fields
                const reply = data.response || data.message || data.content ||
                              data.text || data.output || data.answer ||
                              (data.messages && data.messages[data.messages.length - 1]?.content) ||
                              JSON.stringify(data, null, 2);

                resultsContent.textContent = reply;

            } catch (err) {
                resultsContent.innerHTML = `<span style="color:#ef4444">&#9888; Error: ${err.message}</span>
<span style="color:rgba(0,229,255,0.4);font-size:0.78rem">Make sure Agent Zero is running and CORS allows this origin.</span>`;
            } finally {
                btnCloudMe.disabled = false;
                resultsPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // ═══ SPECTACULAR CLOUD ANIMATION ═══
        const canvas = document.getElementById('cloud-canvas');
        const ctx = canvas.getContext('2d');
        let W = canvas.width = window.innerWidth;
        let H = canvas.height = window.innerHeight;

        // Cloud silhouette bumps
        const BUMPS = [
            { x: 0,    y: 0,    r: 120 },
            { x: -110, y: 25,   r: 85  },
            { x: 110,  y: 25,   r: 85  },
            { x: -60,  y: -62,  r: 75  },
            { x: 60,   y: -62,  r: 75  },
            { x: -175, y: 55,   r: 58  },
            { x: 175,  y: 55,   r: 58  },
        ];

        function inCloud(px, py, cx, cy, scale) {
            return BUMPS.some(b => {
                const dx = px - (cx + b.x * scale);
                const dy = py - (cy + b.y * scale);
                return dx*dx + dy*dy < (b.r * scale) * (b.r * scale);
            });
        }

        function cloudPoints(cx, cy, scale, n) {
            const pts = [];
            let tries = 0;
            while (pts.length < n && tries < n * 30) {
                tries++;
                const b = BUMPS[Math.floor(Math.random() * BUMPS.length)];
                const a = Math.random() * Math.PI * 2;
                const d = Math.random() * b.r * scale;
                const px = cx + b.x * scale + Math.cos(a) * d;
                const py = cy + b.y * scale + Math.sin(a) * d;
                if (inCloud(px, py, cx, cy, scale)) pts.push({ x: px, y: py });
            }
            return pts;
        }

        // Three depth layers: back (dim, slow), mid, front (bright, fast)
        const LAYERS = [
            { count: 200, sizeMin: 1.2, sizeMax: 2.8, speedMul: 0.005, alphaMul: 0.7,  wobble: 0.5,  color: [80, 160, 255]  },
            { count: 280, sizeMin: 1.8, sizeMax: 3.8, speedMul: 0.008, alphaMul: 0.9,  wobble: 0.8,  color: [0,  229, 255]  },
            { count: 140, sizeMin: 2.5, sizeMax: 5.0, speedMul: 0.011, alphaMul: 1.0,  wobble: 1.0,  color: [160, 80, 255]  },
        ];

        class CloudParticle {
            constructor(tx, ty, layer) {
                this.tx = tx; this.ty = ty;
                this.layer = layer;
                this.x = Math.random() * W;
                this.y = Math.random() * H;
                this.vx = 0; this.vy = 0;
                this.size = layer.sizeMin + Math.random() * (layer.sizeMax - layer.sizeMin);
                this.pulse = Math.random() * Math.PI * 2;
                this.speed = layer.speedMul * (0.7 + Math.random() * 0.6);
                this.drift = (Math.random() - 0.5) * 0.15; // gentle horizontal drift
            }
            update() {
                this.pulse += 0.008 + this.speed * 0.15;
                const wobble = Math.sin(this.pulse) * this.layer.wobble;
                this.vx += (this.tx - this.x + wobble + this.drift) * this.speed;
                this.vy += (this.ty - this.y + Math.cos(this.pulse) * this.layer.wobble * 0.4) * this.speed;
                this.vx *= 0.92; this.vy *= 0.92;
                this.x += this.vx; this.y += this.vy;
            }
            draw(breathe) {
                const alpha = this.layer.alphaMul * (0.55 + 0.45 * (0.5 + 0.5 * Math.sin(this.pulse))) * breathe;
                const [r, g, b] = this.layer.color;
                // Glow effect: draw a larger soft halo behind each particle
                const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 3);
                grad.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
                grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                // Bright core dot
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${r},${g},${b},${Math.min(alpha * 1.4, 1)})`;
                ctx.fill();
            }
        }

        // Lightning bolt between two points (recursive jagged line)
        function lightning(x1, y1, x2, y2, depth, alpha) {
            if (depth === 0) {
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = `rgba(180,120,255,${alpha})`;
                ctx.lineWidth = 0.8;
                ctx.stroke();
                return;
            }
            const mx = (x1 + x2) / 2 + (Math.random() - 0.5) * 28 / depth;
            const my = (y1 + y2) / 2 + (Math.random() - 0.5) * 28 / depth;
            lightning(x1, y1, mx, my, depth - 1, alpha);
            lightning(mx, my, x2, y2, depth - 1, alpha);
        }

        let allParticles = [];
        let lightningTimer = 0;
        let activeLightning = [];
        let glowPhase = 0;
        let colorPhase = 0;

        function buildCloud() {
            const scale = Math.min(W, H) / 760;
            const cx = W / 2;
            const cy = H * 0.36;
            allParticles = [];
            LAYERS.forEach(layer => {
                const pts = cloudPoints(cx, cy, scale, layer.count);
                pts.forEach(p => allParticles.push(new CloudParticle(p.x, p.y, layer)));
            });
        }

        function spawnLightning() {
            // Pick two random front-layer particles far enough apart
            const front = allParticles.filter(p => p.layer === LAYERS[2]);
            if (front.length < 2) return;
            const a = front[Math.floor(Math.random() * front.length)];
            const b = front[Math.floor(Math.random() * front.length)];
            const dx = a.x - b.x, dy = a.y - b.y;
            if (Math.sqrt(dx*dx + dy*dy) > 60) {
                activeLightning.push({ x1: a.x, y1: a.y, x2: b.x, y2: b.y, life: 6 });
            }
        }

        function drawGlow(breathe) {
            glowPhase += 0.008;
            colorPhase += 0.004;
            const scale = Math.min(W, H) / 760;
            const cx = W / 2, cy = H * 0.36;

            // Outer atmospheric halo
            const r1 = 280 * scale + Math.sin(glowPhase) * 22 * scale;
            const g1 = ctx.createRadialGradient(cx, cy, r1 * 0.15, cx, cy, r1);
            const hue1 = 190 + Math.sin(colorPhase) * 30; // cycles 160-220
            g1.addColorStop(0, `hsla(${hue1},100%,60%,${0.07 * breathe})`);
            g1.addColorStop(0.4, `hsla(${hue1 + 20},100%,50%,${0.04 * breathe})`);
            g1.addColorStop(1, 'hsla(200,100%,50%,0)');
            ctx.fillStyle = g1;
            ctx.beginPath(); ctx.arc(cx, cy, r1, 0, Math.PI * 2); ctx.fill();

            // Inner core pulse
            const r2 = 100 * scale + Math.sin(glowPhase * 2.3) * 14 * scale;
            const g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, r2);
            g2.addColorStop(0, `rgba(160,80,255,${0.18 * breathe})`);
            g2.addColorStop(0.5, `rgba(0,229,255,${0.08 * breathe})`);
            g2.addColorStop(1, 'rgba(0,229,255,0)');
            ctx.fillStyle = g2;
            ctx.beginPath(); ctx.arc(cx, cy, r2, 0, Math.PI * 2); ctx.fill();
        }

        function connectLayer(layerParticles, maxDist, baseColor, baseAlpha) {
            for (let a = 0; a < layerParticles.length; a++) {
                for (let b = a + 1; b < layerParticles.length; b++) {
                    const dx = layerParticles[a].x - layerParticles[b].x;
                    const dy = layerParticles[a].y - layerParticles[b].y;
                    const d2 = dx*dx + dy*dy;
                    if (d2 < maxDist * maxDist) {
                        const op = (1 - Math.sqrt(d2) / maxDist) * baseAlpha;
                        ctx.strokeStyle = `rgba(${baseColor},${op})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(layerParticles[a].x, layerParticles[a].y);
                        ctx.lineTo(layerParticles[b].x, layerParticles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, W, H);

            // Global breathe (slow sine)
            const breathe = 0.75 + 0.25 * Math.sin(Date.now() * 0.0008);

            drawGlow(breathe);

            // Draw back layer connections
            const back = allParticles.filter(p => p.layer === LAYERS[0]);
            const mid  = allParticles.filter(p => p.layer === LAYERS[1]);
            const front = allParticles.filter(p => p.layer === LAYERS[2]);

            connectLayer(back,  30, '80,160,255', 0.18);
            connectLayer(mid,   38, '0,229,255',  0.28);
            connectLayer(front, 28, '160,80,255', 0.45);

            // Draw all particles (back to front)
            allParticles.forEach(p => { p.update(); p.draw(breathe); });

            // Lightning
            lightningTimer++;
            if (lightningTimer > 90 + Math.random() * 120) {
                lightningTimer = 0;
                spawnLightning();
                if (Math.random() > 0.5) spawnLightning();
            }
            activeLightning = activeLightning.filter(l => l.life > 0);
            activeLightning.forEach(l => {
                lightning(l.x1, l.y1, l.x2, l.y2, 3, l.life / 6 * 0.8);
                l.life--;
            });
        }

        window.addEventListener('resize', () => {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            buildCloud();
        });

        buildCloud();
        animate();
    </script>
</body>
</html>
